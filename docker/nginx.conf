server {
    listen 8080;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    # Upload size limits
    client_max_body_size 500M;
    client_body_timeout 300s;
    client_header_timeout 300s;

    # Laravel Reverb WebSocket support
    location /reverb {
        proxy_pass http://127.0.0.1:6001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Laravel application
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

        # Alles onder /storage/ komt uit storage/app/public
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;

        # Correcte MIME-types (zorg ook dat in http{} 'include mime.types;' staat)
        types {
            video/mp4            mp4;
            video/webm           webm;
            video/ogg            ogg;
            video/x-matroska     mkv;
            video/quicktime      mov;
            video/x-msvideo      avi;
            video/x-flv          flv;
            video/x-ms-wmv       wmv;
            # fallback:
            application/octet-stream  *;
        }

        # Cache: 1 week
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Accept-Ranges bytes always;

        # Efficiënt verzenden
        sendfile on;
        tcp_nopush on;
        aio on;
        gzip off;

        # MP4 specifieke optimalisatie
        location ~* \.mp4$ {
            mp4;
            mp4_buffer_size 1m;
            mp4_max_buffer_size 5m;
            try_files $uri =404;
        }

        # Overige videoformaten, geen mp4-module nodig
        location ~* \.(webm|ogg|mkv|mov|avi|flv|wmv)$ {
            try_files $uri =404;
        }

        # Alles anders onder /storage/
        try_files $uri =404;
    }

        # Video files caching (voor bestanden buiten /storage/)
    location ~* \.(mp4|webm|ogg|avi|mov|wmv|flv|mkv)$ {
        # Correcte MIME-types
        types {
            video/mp4            mp4;
            video/webm           webm;
            video/ogg            ogg;
            video/x-matroska     mkv;
            video/quicktime      mov;
            video/x-msvideo      avi;
            video/x-flv          flv;
            video/x-ms-wmv       wmv;
        }

        # Cache: 1 week
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Accept-Ranges bytes always;

        # Efficiënt verzenden
        sendfile on;
        tcp_nopush on;
        aio on;
        gzip off;

        # MP4 specifieke optimalisatie
        location ~* \.mp4$ {
            mp4;
            mp4_buffer_size 1m;
            mp4_max_buffer_size 5m;
        }

        try_files $uri =404;
    }

    # PHP processing
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # FastCGI settings for large uploads
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
    }

    # Static files (excluding video files which are handled above)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|mp3|wav)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Security - deny access to sensitive files
    location ~ /\. {
        deny all;
    }

    location ~ /\.ht {
        deny all;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
